<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS07 - Network Incident Triage Assistant | NOC Command Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome / Lucide Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #080c14;
      color: #f1f5f9;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 242, 254, 0.04) 0%, transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(127, 0, 255, 0.04) 0%, transparent 30%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.1);
    }
    .glass-active {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-escalated { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-cited { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-satellite-dish text-slate-950 text-xl"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
            NOC<span class="text-cyan-400">.TRIAGE</span>
            <span class="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800 font-mono">TRACK_ID=PS07</span>
          </h1>
          <p class="text-xs text-slate-400">Network Incident Triage Assistant & RAG Engine</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-slate-300">Gemini RAG: <strong class="text-emerald-400">ONLINE</strong></span>
        </div>

        <button id="btn-triage" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-2 transition shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-bolt"></i> Run Triage Simulation
        </button>
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Column 1: Incident Board (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-list-check text-cyan-400"></i> Correlated Incidents (<span id="inc-count">0</span>)
        </h2>
        <span class="text-xs text-slate-500">Sorted by Impact Score</span>
      </div>

      <!-- Incident List Container -->
      <div id="incident-list" class="flex flex-col gap-3 overflow-y-auto max-h-[calc(100vh-160px)] pr-1">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Column 2: Triage & Escalation Detail Panel (4 cols) -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <h2 class="font-bold text-sm text-slate-300 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-microchip text-purple-400"></i> AI Triage & Runbook Grounding
      </h2>

      <div id="detail-panel" class="glass-card rounded-xl p-5 flex flex-col gap-4 min-h-[500px]">
        <div class="text-center text-slate-500 my-auto">
          <i class="fa-solid fa-diagram-project text-4xl mb-3 text-slate-700"></i>
          <p class="text-sm">Select an incident from the left board to view root cause analysis, citations, or escalation packet.</p>
        </div>
      </div>
    </section>

    <!-- Column 3: Noise Feed Panel (3 cols) -->
    <section class="lg:col-span-3 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-filter text-amber-400"></i> Filtered Noise (<span id="noise-count">0</span>)
        </h2>
      </div>

      <div id="noise-list" class="glass-card rounded-xl p-4 flex flex-col gap-2 max-h-[calc(100vh-160px)] overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
